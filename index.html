<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d18">
<title>VYNZO Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#080a12;--card:#111522;--card2:#171b2a;--line:#252b40;--text:#f5f7ff;--muted:#9aa3bb;--accent:#7c5cff;--accent2:#19d3ff;--danger:#ff5577;--ok:#4ade80}
body{margin:0;background:radial-gradient(circle at top,#17142d 0,#080a12 42%,#05060b 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:760px;margin:auto;padding:16px 14px 90px}
.brand{text-align:center;padding:22px 0 14px}
.brand h1{margin:0;font-size:28px;letter-spacing:.4px}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.card{background:rgba(17,21,34,.92);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.auth{max-width:460px;margin:8vh auto}
.tabs{display:flex;gap:8px;background:#0b0e18;border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;padding:11px;border-radius:10px;background:transparent;color:var(--muted)}
.tabs button.active{background:var(--card2);color:#fff}
.field{margin:10px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
input,textarea{width:100%;background:#0b0e18;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
.primary{width:100%;padding:12px 15px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4c8dff);color:#fff;font-weight:700}
.google{width:100%;padding:12px 15px;border-radius:12px;background:#fff;color:#111;font-weight:700;margin-top:9px}
.secondary{padding:10px 13px;border-radius:11px;background:#20263a;color:#fff}
.danger{background:#351827;color:#ff9ab0}
.small{font-size:12px;color:var(--muted)}
.msg{min-height:20px;margin:9px 0;color:var(--muted);font-size:13px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,10,18,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar strong{font-size:19px}
.nav{display:flex;gap:7px}
.nav button{background:#151a29;color:var(--muted);padding:9px 12px;border-radius:11px}
.nav button.active{color:#fff;background:#242b43}
.composer textarea{min-height:75px}
.file-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.file-label{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:11px;background:#20263a;color:#fff;font-size:13px}
.preview{margin-top:10px;border-radius:15px;overflow:hidden;border:1px solid var(--line)}
.preview img,.preview video{display:block;width:100%;max-height:420px;object-fit:cover}
.post-head{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#252b40;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.avatar.big{width:82px;height:82px;font-size:25px}
.user{min-width:0;flex:1}
.user strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.caption{white-space:pre-wrap;line-height:1.5;margin:13px 0}
.post-media{width:100%;max-height:600px;object-fit:cover;border-radius:15px;background:#080a12;margin-top:4px}
.actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.actions button{background:#171c2c;color:#d9def0;padding:9px 11px;border-radius:10px;font-size:13px}
.actions button.liked{color:#ff6f91;background:#301826}
.commentbox{display:flex;gap:7px;margin-top:10px}
.commentbox input{min-width:0}
.commentbox button{padding:0 13px;border-radius:11px;background:var(--accent);color:#fff}
.comments{margin-top:8px}
.comment{padding:8px 0;border-bottom:1px solid #1e2334;font-size:13px}
.comment:last-child{border-bottom:0}
.comment small{color:var(--muted);margin-left:5px}
.empty{text-align:center;color:var(--muted);padding:25px 10px}
.profile-card{text-align:center}
.profile-card .avatar{margin:0 auto 10px}
.stats{display:flex;justify-content:center;gap:34px;margin:15px 0}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.profile-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid>*{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#171b2a}
.grid .text-tile{padding:10px;overflow:hidden;font-size:12px;color:#dce2f5}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#151a29;border:1px solid var(--line);padding:11px 15px;border-radius:13px;z-index:50;max-width:90%;font-size:13px}
.loading{text-align:center;color:var(--muted);padding:20px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:520px){.wrap{padding-left:10px;padding-right:10px}.card{border-radius:17px;padding:13px}.stats{gap:22px}}
</style>
</head>
<body>

<div id="authPage" class="wrap">
  <div class="brand">
    <h1>VYNZO Social</h1>
    <p>Connect • Share • Discover</p>
  </div>
  <div class="card auth">
    <div class="tabs">
      <button id="loginTab" class="active" onclick="switchAuth('login')">Login</button>
      <button id="signupTab" onclick="switchAuth('signup')">Sign Up</button>
    </div>

    <div id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="primary" onclick="login()">Login</button>
    </div>

    <div id="signupForm" class="hidden">
      <div class="field"><label>Full name</label><input id="signupName" type="text" placeholder="Your name"></div>
      <div class="field"><label>Username</label><input id="signupUsername" type="text" placeholder="your_username"></div>
      <div class="field"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Minimum 6 characters"></div>
      <button class="primary" onclick="signup()">Create account</button>
    </div>

    <div style="text-align:center;margin:15px 0;color:#667087">OR</div>
    <button class="google" onclick="googleLogin()">Continue with Google</button>
    <div id="authMsg" class="msg"></div>
    <div class="small">Your account is secured by Supabase Authentication.</div>
  </div>
</div>

<div id="appPage" class="hidden">
  <div class="topbar">
    <div class="topbar-in">
      <strong>VYNZO Social</strong>
      <div class="nav">
        <button id="navHome" class="active" onclick="showPage('home')">🏠</button>
        <button id="navProfile" onclick="showPage('profile')">👤</button>
        <button onclick="logout()">↪</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <section id="homePage">
      <div class="card composer">
        <textarea id="caption" placeholder="What's on your mind?"></textarea>
        <div class="file-row">
          <label class="file-label">📷 Photo / 🎥 Video
            <input id="postFile" type="file" accept="image/*,video/*" hidden onchange="previewPostFile()">
          </label>
          <button class="secondary" onclick="createPost()">Post</button>
        </div>
        <div id="postPreview" class="preview hidden">
          <img id="postPreviewImg" class="hidden" alt="preview">
          <video id="postPreviewVideo" class="hidden" controls playsinline></video>
        </div>
        <div id="postMsg" class="msg"></div>
      </div>
      <div id="feed"><div class="card loading">⏳ Loading feed...</div></div>
    </section>

    <section id="profilePage" class="hidden">
      <div class="card profile-card">
        <img id="profileAvatar" class="avatar big" alt="profile">
        <h2 id="profileName" style="margin:7px 0 2px">User</h2>
        <div id="profileUsername" class="small">@user</div>
        <p id="profileBio" class="small">Welcome to VYNZO Social 🚀</p>

        <div class="stats">
          <div class="stat"><b id="postCount">0</b><span>Posts</span></div>
          <div class="stat"><b id="followerCount">0</b><span>Followers</span></div>
          <div class="stat"><b id="followingCount">0</b><span>Following</span></div>
        </div>

        <div class="profile-actions">
          <label class="secondary">Change Photo
            <input id="profileFile" type="file" accept="image/*" hidden onchange="uploadAvatar()">
          </label>
          <button class="secondary" onclick="removeAvatar()">Remove</button>
          <button class="secondary" onclick="editProfile()">Edit Profile</button>
        </div>
        <div id="profileMsg" class="msg"></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">My Posts</h3>
        <div id="myPosts" class="grid"><div class="empty">Loading...</div></div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = "https://gvfbdfzrhgknqypwwvcy.supabase.co";
const SUPABASE_KEY = "sb_publishable_1JMvSM6APbvinNr5yaDzLg_rwBKEZoh";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let allPosts = [];
let previewObjectUrl = null;

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function escapeAttr(value){ return escapeHtml(value); }

function msg(id,text){
  const el=document.getElementById(id);
  if(el) el.textContent=text;
}
function toast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.remove("hidden");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.classList.add("hidden"),2600);
}
function initials(name){
  const s=String(name||"V").trim();
  return s.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"V";
}
function setAvatar(id,url,name){
  const el=document.getElementById(id);
  if(!el)return;
  if(url){
    el.outerHTML='<img id="'+id+'" class="'+el.className+'" src="'+escapeAttr(url)+'" alt="avatar" onerror="this.onerror=null;this.src=\'\';">';
  }else{
    el.outerHTML='<div id="'+id+'" class="'+el.className+'">'+escapeHtml(initials(name))+'</div>';
  }
}
function timeAgo(date){
  const seconds=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/1000));
  if(seconds<60)return "now";
  if(seconds<3600)return Math.floor(seconds/60)+"m";
  if(seconds<86400)return Math.floor(seconds/3600)+"h";
  if(seconds<604800)return Math.floor(seconds/86400)+"d";
  return new Date(date).toLocaleDateString();
}
function switchAuth(mode){
  const login=mode==="login";
  document.getElementById("loginForm").classList.toggle("hidden",!login);
  document.getElementById("signupForm").classList.toggle("hidden",login);
  document.getElementById("loginTab").classList.toggle("active",login);
  document.getElementById("signupTab").classList.toggle("active",!login);
  msg("authMsg","");
}

async function login(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!email||!password){msg("authMsg","Please enter email and password.");return}
  msg("authMsg","⏳ Logging in...");
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){msg("authMsg","❌ "+error.message);return}
  msg("authMsg","✅ Login successful.");
}
async function signup(){
  const name=document.getElementById("signupName").value.trim();
  const username=document.getElementById("signupUsername").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30);
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;
  if(!name||!username||!email||password.length<6){
    msg("authMsg","Enter all fields. Password must be at least 6 characters.");return;
  }
  msg("authMsg","⏳ Creating account...");
  const {data,error}=await supabaseClient.auth.signUp({
    email,password,
    options:{data:{full_name:name,username}}
  });
  if(error){msg("authMsg","❌ "+error.message);return}
  if(data.session){
    msg("authMsg","✅ Account created.");
  }else{
    msg("authMsg","✅ Account created. Please check your email if confirmation is enabled.");
  }
}
async function googleLogin(){
  msg("authMsg","⏳ Opening Google Login...");
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await supabaseClient.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo}
  });
  if(error)msg("authMsg","❌ "+error.message);
}
async function logout(){
  await supabaseClient.auth.signOut();
}

async function ensureProfile(user){
  let {data,error}=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error)throw error;
  if(!data){
    const meta=user.user_metadata||{};
    const base=String(meta.username||meta.full_name||"user").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24)||"user";
    let username=base;
    for(let i=1;i<100;i++){
      const {data:exists}=await supabaseClient.from("profiles").select("id").eq("username",username).maybeSingle();
      if(!exists)break;
      username=base+"_"+i;
    }
    const {data:newProfile,error:insertError}=await supabaseClient.from("profiles")
      .insert({id:user.id,username,full_name:meta.full_name||""})
      .select().single();
    if(insertError)throw insertError;
    data=newProfile;
  }
  return data;
}

async function enterApp(user){
  currentUser=user;
  try{
    currentProfile=await ensureProfile(user);
    document.getElementById("authPage").classList.add("hidden");
    document.getElementById("appPage").classList.remove("hidden");
    await refreshProfile();
    await Promise.all([loadFeed(),loadCounts(),loadMyPosts()]);
  }catch(e){
    console.error(e);
    msg("authMsg","❌ "+e.message);
    toast("Profile setup failed");
  }
}

async function refreshProfile(){
  if(!currentUser)return;
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
  if(error){console.error(error);return}
  if(data)currentProfile=data;
  const p=currentProfile||{};
  document.getElementById("profileName").textContent=p.full_name||"VYNZO User";
  document.getElementById("profileUsername").textContent="@"+(p.username||"user");
  document.getElementById("profileBio").textContent=p.bio||"Welcome to VYNZO Social 🚀";
  setAvatar("profileAvatar",p.avatar_url,p.full_name||p.username);
}

async function loadCounts(){
  if(!currentUser)return;
  const [{count:posts},{count:followers},{count:following}]=await Promise.all([
    supabaseClient.from("posts").select("id",{count:"exact",head:true}).eq("user_id",currentUser.id),
    supabaseClient.from("follows").select("id",{count:"exact",head:true}).eq("following_id",currentUser.id),
    supabaseClient.from("follows").select("id",{count:"exact",head:true}).eq("follower_id",currentUser.id)
  ]);
  document.getElementById("postCount").textContent=posts||0;
  document.getElementById("followerCount").textContent=followers||0;
  document.getElementById("followingCount").textContent=following||0;
}

function previewPostFile(){
  const file=document.getElementById("postFile").files[0];
  const box=document.getElementById("postPreview");
  const img=document.getElementById("postPreviewImg");
  const vid=document.getElementById("postPreviewVideo");
  if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);
  previewObjectUrl=null;
  img.classList.add("hidden");vid.classList.add("hidden");box.classList.add("hidden");
  if(!file)return;
  if(file.size>50*1024*1024){msg("postMsg","File must be under 50MB.");document.getElementById("postFile").value="";return}
  previewObjectUrl=URL.createObjectURL(file);
  if(file.type.startsWith("video/")){vid.src=previewObjectUrl;vid.classList.remove("hidden")}
  else{img.src=previewObjectUrl;img.classList.remove("hidden")}
  box.classList.remove("hidden");
}

async function uploadToBucket(file,bucket){
  if(!currentUser)throw new Error("Please login first.");
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=currentUser.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
  const {error}=await supabaseClient.storage.from(bucket).upload(path,file,{
    upsert:false,contentType:file.type||"application/octet-stream"
  });
  if(error)throw error;
  const {data}=supabaseClient.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

async function createPost(){
  if(!currentUser){toast("Please login");return}
  const file=document.getElementById("postFile").files[0];
  const caption=document.getElementById("caption").value.trim();
  if(!file&&!caption){msg("postMsg","Write something or add a photo/video.");return}
  if(file&&file.type.startsWith("video/")&&file.size>50*1024*1024){
    msg("postMsg","Video must be under 50MB.");return;
  }
  if(file&&file.type.startsWith("image/")&&file.size>15*1024*1024){
    msg("postMsg","Image must be under 15MB.");return;
  }
  msg("postMsg","⏳ Publishing...");
  try{
    let media_url=null,media_type=null;
    if(file){
      media_type=file.type.startsWith("video/")?"video":"image";
      media_url=await uploadToBucket(file,media_type==="video"?"videos":"posts");
    }
    const {error}=await supabaseClient.from("posts").insert({
      user_id:currentUser.id,media_url,media_type,caption
    });
    if(error)throw error;
    document.getElementById("caption").value="";
    document.getElementById("postFile").value="";
    if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl=null;
    document.getElementById("postPreview").classList.add("hidden");
    document.getElementById("postPreviewImg").src="";
    document.getElementById("postPreviewVideo").src="";
    msg("postMsg","✅ Posted successfully!");
    toast("Post published");
    await Promise.all([loadFeed(),loadMyPosts(),loadCounts()]);
  }catch(e){
    console.error(e);
    msg("postMsg","❌ "+e.message);
  }
}

async function loadFeed(){
  const box=document.getElementById("feed");
  box.innerHTML='<div class="card loading">⏳ Loading posts...</div>';
  try{
    const {data:posts,error:postError}=await supabaseClient.from("posts")
      .select("*").order("created_at",{ascending:false}).limit(50);
    if(postError)throw postError;

    if(!posts||!posts.length){
      allPosts=[];
      box.innerHTML='<div class="card empty">No posts yet. Be the first to post! 🚀</div>';
      return;
    }

    const ids=[...new Set(posts.map(p=>p.user_id).filter(Boolean))];
    let profiles=[];
    if(ids.length){
      const {data,error}=await supabaseClient.from("profiles")
        .select("id,username,full_name,bio,avatar_url").in("id",ids);
      if(error)throw error;
      profiles=data||[];
    }
    const map=new Map(profiles.map(p=>[p.id,p]));
    allPosts=posts.map(p=>({...p,profile:map.get(p.user_id)||{}}));

    box.innerHTML=allPosts.map(renderPost).join("");
    await hydratePostState();
  }catch(e){
    console.error("VYNZO Feed Error:",e);
    box.innerHTML='<div class="card empty">❌ Unable to load posts.<br><br><small>'+escapeHtml(e.message)+'</small></div>';
  }
}

function renderPost(p){
  const prof=p.profile||{};
  const name=prof.full_name||prof.username||"VYNZO User";
  const avatar=prof.avatar_url
    ? '<img class="avatar" src="'+escapeAttr(prof.avatar_url)+'" alt="avatar">'
    : '<div class="avatar">'+escapeHtml(initials(name))+'</div>';
  let media="";
  if(p.media_url){
    if(p.media_type==="video"){
      media='<video class="post-media" src="'+escapeAttr(p.media_url)+'" controls playsinline preload="metadata"></video>';
    }else{
      media='<img class="post-media" src="'+escapeAttr(p.media_url)+'" alt="post image" loading="lazy">';
    }
  }
  const del=p.user_id===currentUser.id
    ? '<button onclick="deletePost(\''+escapeAttr(p.id)+'\')">🗑 Delete</button>' : "";
  return '<div class="card post" id="post-'+escapeAttr(p.id)+'">'+
    '<div class="post-head">'+avatar+
      '<div class="user"><strong>'+escapeHtml(name)+'</strong>'+
      '<span>@'+escapeHtml(prof.username||"user")+' • '+timeAgo(p.created_at)+'</span></div>'+
    '</div>'+
    (p.caption?'<div class="caption">'+escapeHtml(p.caption)+'</div>':"")+
    media+
    '<div class="actions">'+
      '<button id="like-'+escapeAttr(p.id)+'" onclick="toggleLike(\''+escapeAttr(p.id)+'\')">♡ Like</button>'+
      '<button onclick="focusComment(\''+escapeAttr(p.id)+'\')">💬 Comment</button>'+
      del+
    '</div>'+
    '<div id="comments-'+escapeAttr(p.id)+'" class="comments"></div>'+
    '<div class="commentbox"><input id="comment-'+escapeAttr(p.id)+'" placeholder="Write a comment..." maxlength="500" onkeydown="if(event.key===\'Enter\')addComment(\''+escapeAttr(p.id)+'\')"><button onclick="addComment(\''+escapeAttr(p.id)+'\')">Send</button></div>'+
  '</div>';
}

async function hydratePostState(){
  if(!allPosts.length)return;
  const ids=allPosts.map(p=>p.id);
  try{
    const {data:likes,error:likeError}=await supabaseClient.from("likes")
      .select("post_id,user_id").in("post_id",ids).eq("user_id",currentUser.id);
    if(likeError)console.warn("Like state:",likeError.message);
    const liked=new Set((likes||[]).map(x=>x.post_id));
    for(const id of ids){
      const b=document.getElementById("like-"+id);
      if(b&&liked.has(id)){b.classList.add("liked");b.textContent="♥ Liked"}
    }
  }catch(e){console.warn(e)}

  for(const p of allPosts)await loadComments(p.id);
}

async function toggleLike(postId){
  const button=document.getElementById("like-"+postId);
  try{
    const {data,error:findError}=await supabaseClient.from("likes")
      .select("post_id").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
    if(findError)throw findError;
    if(data){
      const {error}=await supabaseClient.from("likes").delete()
        .eq("post_id",postId).eq("user_id",currentUser.id);
      if(error)throw error;
      if(button){button.classList.remove("liked");button.textContent="♡ Like"}
    }else{
      const {error}=await supabaseClient.from("likes")
        .insert({post_id:postId,user_id:currentUser.id});
      if(error)throw error;
      if(button){button.classList.add("liked");button.textContent="♥ Liked"}
    }
  }catch(e){toast("Like error: "+e.message)}
}

async function loadComments(postId){
  const box=document.getElementById("comments-"+postId);
  if(!box)return;
  try{
    const {data:comments,error}=await supabaseClient.from("comments")
      .select("*").eq("post_id",postId).order("created_at",{ascending:true}).limit(50);
    if(error)throw error;

    const ids=[...new Set((comments||[]).map(c=>c.user_id).filter(Boolean))];
    let profiles=[];
    if(ids.length){
      const {data,error:profileError}=await supabaseClient.from("profiles")
        .select("id,username,full_name").in("id",ids);
      if(profileError)throw profileError;
      profiles=data||[];
    }
    const map=new Map(profiles.map(p=>[p.id,p]));
    box.innerHTML=(comments||[]).map(c=>{
      const p=map.get(c.user_id)||{};
      return '<div class="comment"><b>@'+escapeHtml(p.username||"user")+
        '</b> '+escapeHtml(c.content||"")+
        ' <small>'+timeAgo(c.created_at)+'</small></div>';
    }).join("");
  }catch(e){
    console.warn("Comments error:",e.message);
    box.innerHTML='<div class="small">Comments unavailable.</div>';
  }
}

async function addComment(postId){
  const input=document.getElementById("comment-"+postId);
  const content=input?.value.trim();
  if(!content)return;
  try{
    const {error}=await supabaseClient.from("comments")
      .insert({post_id:postId,user_id:currentUser.id,content});
    if(error)throw error;
    input.value="";
    await loadComments(postId);
  }catch(e){toast("Comment error: "+e.message)}
}
function focusComment(id){
  const el=document.getElementById("comment-"+id);
  if(el){el.focus();el.scrollIntoView({behavior:"smooth",block:"center"})}
}

async function deletePost(id){
  if(!confirm("Delete this post?"))return;
  try{
    const {error}=await supabaseClient.from("posts").delete()
      .eq("id",id).eq("user_id",currentUser.id);
    if(error)throw error;
    document.getElementById("post-"+id)?.remove();
    toast("Post deleted");
    await Promise.all([loadFeed(),loadMyPosts(),loadCounts()]);
  }catch(e){toast("Delete error: "+e.message)}
}

async function loadMyPosts(){
  const box=document.getElementById("myPosts");
  box.innerHTML='<div class="empty">⏳ Loading...</div>';
  try{
    const {data,error}=await supabaseClient.from("posts")
      .select("id,media_url,media_type,caption,created_at")
      .eq("user_id",currentUser.id).order("created_at",{ascending:false});
    if(error)throw error;
    if(!data?.length){box.innerHTML='<div class="empty">You have no posts yet.</div>';return}
    box.innerHTML=data.map(p=>{
      if(!p.media_url)return '<div class="text-tile">'+escapeHtml(p.caption||"Text post")+'</div>';
      if(p.media_type==="video")return '<video src="'+escapeAttr(p.media_url)+'" controls playsinline preload="metadata"></video>';
      return '<img src="'+escapeAttr(p.media_url)+'" alt="my post" loading="lazy">';
    }).join("");
  }catch(e){
    console.error(e);
    box.innerHTML='<div class="empty">❌ '+escapeHtml(e.message)+'</div>';
  }
}

async function uploadAvatar(){
  const file=document.getElementById("profileFile").files[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){msg("profileMsg","Please choose an image.");return}
  if(file.size>8*1024*1024){msg("profileMsg","Image must be under 8MB.");return}
  msg("profileMsg","⏳ Uploading profile photo...");
  try{
    const url=await uploadToBucket(file,"avatars");
    const {data,error}=await supabaseClient.from("profiles").update({avatar_url:url})
      .eq("id",currentUser.id).select().single();
    if(error)throw error;
    currentProfile=data;
    await refreshProfile();
    msg("profileMsg","✅ Profile photo updated!");
    toast("Profile photo updated");
    await loadFeed();
  }catch(e){
    console.error(e);
    msg("profileMsg","❌ "+e.message);
  }
  document.getElementById("profileFile").value="";
}

async function removeAvatar(){
  if(!confirm("Remove profile photo?"))return;
  const {data,error}=await supabaseClient.from("profiles").update({avatar_url:null})
    .eq("id",currentUser.id).select().single();
  if(error){msg("profileMsg","❌ "+error.message);return}
  currentProfile=data;
  await refreshProfile();
  msg("profileMsg","✅ Profile photo removed.");
  await loadFeed();
}

async function editProfile(){
  const p=currentProfile||{};
  const name=prompt("Full name:",p.full_name||"");
  if(name===null)return;
  const usernameInput=prompt("Username (letters, numbers, _):",p.username||"user");
  if(usernameInput===null)return;
  const bio=prompt("Bio:",p.bio||"");
  if(bio===null)return;
  const username=usernameInput.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30);
  if(!username){msg("profileMsg","Invalid username.");return}
  const {data,error}=await supabaseClient.from("profiles")
    .update({full_name:name.trim().slice(0,80),username,bio:bio.trim().slice(0,300)})
    .eq("id",currentUser.id).select().single();
  if(error){
    msg("profileMsg",error.code==="23505"?"❌ Username already exists.":"❌ "+error.message);
    return;
  }
  currentProfile=data;
  await refreshProfile();
  await loadFeed();
  msg("profileMsg","✅ Profile updated!");
  toast("Profile updated");
}

function showPage(page){
  const home=page==="home";
  document.getElementById("homePage").classList.toggle("hidden",!home);
  document.getElementById("profilePage").classList.toggle("hidden",home);
  document.getElementById("navHome").classList.toggle("active",home);
  document.getElementById("navProfile").classList.toggle("active",!home);
  if(!home){
    refreshProfile();
    loadMyPosts();
    loadCounts();
  }else{
    loadFeed();
  }
}

supabaseClient.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user){
    if(!currentUser || currentUser.id!==session.user.id)await enterApp(session.user);
  }else{
    currentUser=null;currentProfile=null;allPosts=[];
    document.getElementById("appPage").classList.add("hidden");
    document.getElementById("authPage").classList.remove("hidden");
  }
});

(async()=>{
  const {data:{session},error}=await supabaseClient.auth.getSession();
  if(error){console.error(error);return}
  if(session?.user)await enterApp(session.user);
})();
</script>
