<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYNZO Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#111827;
  padding-bottom:75px;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#635bff;
}

.searchBox{
  width:42%;
  max-width:260px;
}

.searchBox input{
  width:100%;
  background:#f1f3f7;
  border:0;
  outline:0;
  border-radius:20px;
  padding:10px 15px;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#635bff,#9b5cff);
}

.authCard{
  width:100%;
  max-width:400px;
  background:#fff;
  border-radius:25px;
  padding:28px 22px;
  box-shadow:0 20px 60px #0003;
}

.authCard h1{
  text-align:center;
  color:#635bff;
  margin-bottom:7px;
}

.authCard p{
  text-align:center;
  color:#777;
  margin-bottom:22px;
}

.field{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.primary{
  width:100%;
  background:#635bff;
  color:#fff;
  padding:13px;
  border-radius:12px;
  margin-top:8px;
  font-weight:bold;
}

.google{
  width:100%;
  background:#fff;
  border:1px solid #ddd;
  padding:13px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.switch{
  text-align:center;
  margin-top:15px;
  color:#635bff;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

.profileHead{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatar.small{
  width:42px;
  height:42px;
}

.profileInfo{
  flex:1;
}

.profileInfo h2{
  font-size:19px;
}

.username{
  color:#777;
  font-size:14px;
}

.bio{
  margin-top:6px;
  color:#555;
}

.stats{
  display:flex;
  justify-content:space-around;
  text-align:center;
  margin:18px 0;
}

.stats b{
  display:block;
  font-size:18px;
}

.actionRow{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.secondary{
  background:#eef0f5;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
}

.followBtn{
  background:#635bff;
  color:#fff;
  padding:8px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.following{
  background:#e9e9ee;
  color:#222;
}

.postHead{
  display:flex;
  align-items:center;
  gap:10px;
}

.postUser{
  flex:1;
}

.postUser b{
  display:block;
}

.postTime{
  color:#888;
  font-size:12px;
}

.postMenu{
  background:none;
  font-size:22px;
}

.caption{
  margin:13px 0;
  line-height:1.5;
}

.postMedia{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:12px;
  background:#111;
}

.postActions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:8px;
}

.postActions button{
  background:none;
  padding:8px;
  color:#444;
  font-size:14px;
  flex:1;
  border-radius:8px;
}

.postActions button:active{
  background:#f0f1f5;
}

.commentBox{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.commentBox input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:9px 13px;
  outline:none;
}

.commentBox button{
  background:#635bff;
  color:#fff;
  padding:8px 14px;
  border-radius:20px;
}

.comments{
  margin-top:8px;
}

.comment{
  background:#f4f5f7;
  padding:8px 11px;
  border-radius:10px;
  margin-top:6px;
  font-size:13px;
}

.searchResults{
  position:absolute;
  top:55px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ddd;
  max-height:350px;
  overflow:auto;
  z-index:100;
}

.searchWrap{
  position:relative;
}

.result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 13px;
  border-bottom:1px solid #eee;
}

.resultInfo{
  flex:1;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:80;
}

.bottomNav button{
  background:none;
  color:#666;
  font-size:22px;
}

.bottomNav button span{
  display:block;
  font-size:10px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modalCard{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:18px;
}

.close{
  float:right;
  background:#eee;
  width:32px;
  height:32px;
  border-radius:50%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
  margin-top:15px;
}

.grid img,
.grid video{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.fileLabel{
  display:block;
  background:#f0f1f5;
  padding:12px;
  border-radius:10px;
  text-align:center;
  margin-top:8px;
}

@media(max-width:500px){
  .searchBox{
    width:45%;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authPage" class="auth">
  <div class="authCard">

    <h1>VYNZO</h1>
    <p>Connect • Share • Discover</p>

    <div id="loginForm">
      <input id="loginEmail" class="field" type="email" placeholder="Email">
      <input id="loginPassword" class="field" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Login</button>

      <button class="google" onclick="googleLogin()">
        🇬 Continue with Google
      </button>

      <div class="switch" onclick="showSignup()">
        Create new account
      </div>
    </div>

    <div id="signupForm" class="hidden">
      <input id="signupName" class="field" placeholder="Full name">
      <input id="signupUsername" class="field" placeholder="Username">
      <input id="signupEmail" class="field" type="email" placeholder="Email">
      <input id="signupPassword" class="field" type="password" placeholder="Password">

      <button class="primary" onclick="signup()">Create Account</button>

      <div class="switch" onclick="showLogin()">
        Already have an account? Login
      </div>
    </div>

    <div id="authMessage" class="message"></div>

  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="topbar">

  <div class="logo">VYNZO</div>

  <div class="searchBox searchWrap">
    <input
      id="searchInput"
      placeholder="🔎 Search users..."
      oninput="searchUsers()"
    >
    <div id="searchResults" class="searchResults hidden"></div>
  </div>

  <button onclick="logout()">🚪</button>

</header>

<main class="container">

  <!-- HOME -->
  <section id="homePage">

    <div class="card">
      <div class="postHead">
        <img id="composerAvatar" class="avatar small">
        <button
          class="secondary"
          style="flex:1;text-align:left"
          onclick="openCreatePost()">
          What's on your mind?
        </button>
      </div>
    </div>

    <div id="feed">
      <div class="card empty">⏳ Loading posts...</div>
    </div>

  </section>

  <!-- PROFILE -->
  <section id="profilePage" class="hidden">

    <div class="card">

      <div class="profileHead">

        <img id="myAvatar" class="avatar">

        <div class="profileInfo">
          <h2 id="myName">User</h2>
          <div id="myUsername" class="username">@user</div>
          <div id="myBio" class="bio"></div>
        </div>

      </div>

      <div class="stats">
        <div>
          <b id="postCount">0</b>
          Posts
        </div>

        <div>
          <b id="followersCount">0</b>
          Followers
        </div>

        <div>
          <b id="followingCount">0</b>
          Following
        </div>
      </div>

      <div class="actionRow">
        <button class="secondary" onclick="openEditProfile()">
          ✏️ Edit Profile
        </button>

        <label class="fileLabel" style="flex:1">
          🖼️ Profile Photo
          <input
            type="file"
            accept="image/*"
            hidden
            onchange="changeAvatar(event)"
          >
        </label>
      </div>

    </div>

    <div id="myPosts" class="grid"></div>

  </section>

</main>

<!-- BOTTOM NAV -->
<nav class="bottomNav">

  <button onclick="showPage('home')">
    🏠
    <span>Home</span>
  </button>

  <button onclick="openCreatePost()">
    ➕
    <span>Create</span>
  </button>

  <button onclick="showPage('profile')">
    👤
    <span>Profile</span>
  </button>

</nav>

</div>

<!-- CREATE POST MODAL -->
<div id="createModal" class="modal hidden">

  <div class="modalCard">

    <button class="close" onclick="closeCreatePost()">✕</button>

    <h2>Create Post</h2>

    <textarea
      id="postCaption"
      class="field"
      rows="5"
      placeholder="Write something..."
    ></textarea>

    <label class="fileLabel">
      📸 Choose Photo / Video
      <input
        id="postFile"
        type="file"
        accept="image/*,video/*"
        hidden
      >
    </label>

    <button class="primary" onclick="createPost()">
      🚀 Publish Post
    </button>

    <div id="postMessage" class="message"></div>

  </div>

</div>

<!-- EDIT PROFILE -->
<div id="editModal" class="modal hidden">

  <div class="modalCard">

    <button class="close" onclick="closeEditProfile()">✕</button>

    <h2>Edit Profile</h2>

    <input
      id="editName"
      class="field"
      placeholder="Full name"
    >

    <input
      id="editUsername"
      class="field"
      placeholder="Username"
    >

    <textarea
      id="editBio"
      class="field"
      rows="4"
      placeholder="Bio"
    ></textarea>

    <button class="primary" onclick="saveProfile()">
      💾 Save Profile
    </button>

  </div>

</div>

<!-- OTHER PROFILE -->
<div id="userModal" class="modal hidden">

  <div class="modalCard">

    <button class="close" onclick="closeUserProfile()">✕</button>

    <div id="userProfileContent"></div>

  </div>

</div>

<script>
/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://gvfbdfzrhgknqypwwvcy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1JMvSM6APbvinNr5yaDzLg_rwBKEZoh";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let allPosts = [];


/* ==============================
   HELPERS
============================== */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showMessage(text){
  $("authMessage").textContent = text;
}

function avatar(url){
  return url ||
  "https://ui-avatars.com/api/?name=VYNZO&background=635bff&color=fff";
}


/* ==============================
   AUTH UI
============================== */

function showSignup(){
  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");
  showMessage("");
}

function showLogin(){
  $("signupForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  showMessage("");
}


/* ==============================
   SIGNUP
============================== */

async function signup(){

  const full_name =
    $("signupName").value.trim();

  const username =
    $("signupUsername").value.trim();

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  if(!email || !password || !username){
    showMessage("⚠️ Please fill all required fields.");
    return;
  }

  showMessage("⏳ Creating account...");

  const {error} =
    await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        data:{
          full_name,
          username
        }
      }

    });

  if(error){
    showMessage("❌ " + error.message);
    return;
  }

  showMessage(
    "✅ Account created. You can login now."
  );

  showLogin();
}


/* ==============================
   LOGIN
============================== */

async function login(){

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;

  showMessage("⏳ Logging in...");

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    showMessage("❌ " + error.message);
    return;
  }

  currentUser = data.user;

  await startApp();
}


/* ==============================
   GOOGLE LOGIN
============================== */

async function googleLogin(){

  showMessage("⏳ Opening Google Login...");

  const {error} =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{
        redirectTo:
        "https://rahulxylf-sys.github.io/vynzo-social/"
      }

    });

  if(error){
    showMessage("❌ " + error.message);
  }
}


/* ==============================
   LOGOUT
============================== */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();
}


/* ==============================
   START APP
============================== */

async function startApp(){

  $("authPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  const {data:userData} =
    await supabaseClient.auth.getUser();

  currentUser = userData.user;

  await loadProfile();
  await loadFeed();
}


/* ==============================
   PROFILE
============================== */

async function loadProfile(){

  if(!currentUser) return;

  let {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data){

    const username =
      currentUser.user_metadata?.username ||
      "user_" +
      currentUser.id.slice(0,6);

    const full_name =
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "VYNZO User";

    const result =
      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          username,
          full_name
        })
        .select()
        .single();

    data = result.data;
  }

  currentProfile = data;

  $("myName").textContent =
    data.full_name || "VYNZO User";

  $("myUsername").textContent =
    "@" + (data.username || "user");

  $("myBio").textContent =
    data.bio || "";

  $("myAvatar").src =
    avatar(data.avatar_url);

  $("composerAvatar").src =
    avatar(data.avatar_url);

  await loadProfileStats();
  await loadMyPosts();
}


/* ==============================
   PROFILE STATS
============================== */

async function loadProfileStats(){

  const {count:posts} =
    await supabaseClient
      .from("posts")
      .select("*",{count:"exact",head:true})
      .eq("user_id",currentUser.id);

  const {count:followers} =
    await supabaseClient
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq("following_id",currentUser.id);

  const {count:following} =
    await supabaseClient
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq("follower_id",currentUser.id);

  $("postCount").textContent =
    posts || 0;

  $("followersCount").textContent =
    followers || 0;

  $("followingCount").textContent =
    following || 0;
}


/* ==============================
   FEED
============================== */

async function loadFeed(){

  const box = $("feed");

  box.innerHTML =
    '<div class="card empty">⏳ Loading posts...</div>';

  try{

    const {data:posts,error:postError} =
      await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false});

    if(postError) throw postError;

    if(!posts || posts.length===0){

      box.innerHTML =
        '<div class="card empty">No posts yet 🚀</div>';

      return;
    }

    const userIds =
      [...new Set(
        posts
          .map(p=>p.user_id)
          .filter(Boolean)
      )];

    let profiles=[];

    if(userIds.length){

      const {data,error} =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,full_name,avatar_url"
          )
          .in("id",userIds);

      if(error) throw error;

      profiles=data || [];
    }

    allPosts =
      posts.map(post=>{

        const profile =
          profiles.find(
            p=>p.id===post.user_id
          ) || {};

        return {
          ...post,
          profiles:profile
        };

      });

    box.innerHTML =
      allPosts.map(renderPost).join("");

    for(const post of allPosts){
      await loadPostStats(post.id);
      await loadComments(post.id);
    }

  }catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="card empty">' +
      '❌ Unable to load posts.<br><br>' +
      '<small>' +
      escapeHtml(error.message) +
      '</small></div>';
  }
}


/* ==============================
   RENDER POST
============================== */

function renderPost(post){

  const p =
    post.profiles || {};

  const own =
    post.user_id === currentUser.id;

  let media="";

  if(post.media_url){

    if(post.media_type==="video"){

      media =
      `<video
        class="postMedia"
        src="${escapeHtml(post.media_url)}"
        controls>
      </video>`;

    }else{

      media =
      `<img
        class="postMedia"
        src="${escapeHtml(post.media_url)}"
        loading="lazy">`;
    }
  }

  return `
  <article class="card" id="post-${post.id}">

    <div class="postHead">

      <img
        class="avatar small"
        src="${avatar(p.avatar_url)}">

      <div
        class="postUser"
        onclick="openUserProfile('${post.user_id}')"
        style="cursor:pointer">

        <b>${escapeHtml(
          p.full_name || p.username || "VYNZO User"
        )}</b>

        <span class="postTime">
          @${escapeHtml(p.username || "user")}
          • ${formatDate(post.created_at)}
        </span>

      </div>

      ${
        own
        ? `<button
             class="postMenu"
             onclick="deletePost('${post.id}')">
             🗑️
           </button>`
        : `<button
             class="followBtn"
             id="follow-${post.user_id}"
             onclick="toggleFollow('${post.user_id}')">
             Follow
           </button>`
      }

    </div>

    ${
      post.caption
      ? `<div class="caption">
          ${escapeHtml(post.caption)}
         </div>`
      : ""
    }

    ${media}

    <div class="postActions">

      <button onclick="toggleLike('${post.id}')">
        ❤️ <span id="likes-${post.id}">0</span>
      </button>

      <button onclick="focusComment('${post.id}')">
        💬 Comment
      </button>

      <button onclick="sharePost('${post.id}')">
        ➤ Share
      </button>

    </div>

    <div id="comments-${post.id}" class="comments"></div>

    <div class="commentBox">

      <input
        id="commentInput-${post.id}"
        placeholder="Write a comment...">

      <button
        onclick="addComment('${post.id}')">
        Send
      </button>

    </div>

  </article>
  `;
}


/* ==============================
   DATE
============================== */

function formatDate(date){

  if(!date) return "";

  return new Date(date)
    .toLocaleString();
}


/* ==============================
   LIKE
============================== */

async function loadPostStats(postId){

  const {count} =
    await supabaseClient
      .from("likes")
      .select("*",{count:"exact",head:true})
      .eq("post_id",postId);

  const el =
    $("likes-"+postId);

  if(el)
    el.textContent=count || 0;

  const {data} =
    await supabaseClient
      .from("likes")
      .select("post_id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  const btn =
    el?.parentElement;

  if(btn && data){
    btn.innerHTML =
      "💖 <span id='likes-"+postId+"'>"+
      (count||0)+"</span>";
  }
}


async function toggleLike(postId){

  const {data} =
    await supabaseClient
      .from("likes")
      .select("*")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(data){

    await supabaseClient
      .from("likes")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",currentUser.id);

  }else{

    await supabaseClient
      .from("likes")
      .insert({
        post_id:postId,
        user_id:currentUser.id
      });
  }

  await loadPostStats(postId);
}


/* ==============================
   COMMENTS
============================== */

async function loadComments(postId){

  const box =
    $("comments-"+postId);

  if(!box) return;

  const {data:comments,error} =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    return;
  }

  const ids =
    [...new Set(
      (comments||[])
        .map(c=>c.user_id)
        .filter(Boolean)
    )];

  let profiles=[];

  if(ids.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,full_name"
        )
        .in("id",ids);

    profiles=result.data || [];
  }

  box.innerHTML =
    (comments||[])
      .map(c=>{

        const p =
          profiles.find(
            x=>x.id===c.user_id
          ) || {};

        return `
        <div class="comment">
          <b>
            ${escapeHtml(
              p.full_name || p.username || "User"
            )}
          </b>
          ${escapeHtml(c.content)}
        </div>
        `;

      }).join("");
}


async function addComment(postId){

  const input =
    $("commentInput-"+postId);

  const content =
    input.value.trim();

  if(!content) return;

  const {error} =
    await supabaseClient
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        content
      });

  if(error){

    alert("❌ "+error.message);
    return;
  }

  input.value="";

  await loadComments(postId);
}


function focusComment(id){

  const input =
    $("commentInput-"+id);

  if(input){
    input.focus();
  }
}


/* ==============================
   SHARE
============================== */

async function sharePost(postId){

  const url =
    location.origin +
    location.pathname +
    "?post=" +
    postId;

  const post =
    allPosts.find(
      p=>p.id===postId
    );

  const text =
    post?.caption ||
    "Check this post on VYNZO Social!";

  try{

    if(navigator.share){

      await navigator.share({

        title:"VYNZO Social",

        text:text,

        url:url
      });

      return;
    }

    if(navigator.clipboard){

      await navigator.clipboard.writeText(url);

      alert("✅ Post link copied!");

      return;
    }

    prompt(
      "Copy this post link:",
      url
    );

  }catch(error){

    if(error.name!=="AbortError"){
      alert("❌ Share failed");
    }
  }
}


/* ==============================
   FOLLOW
============================== */

async function toggleFollow(userId){

  if(userId===currentUser.id)
    return;

  const {data} =
    await supabaseClient
      .from("follows")
      .select("*")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  if(data){

    await supabaseClient
      .from("follows")
      .delete()
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId);

  }else{

    const {error} =
      await supabaseClient
        .from("follows")
        .insert({
          follower_id:currentUser.id,
          following_id:userId
        });

    if(error){
      alert("❌ "+error.message);
      return;
    }
  }

  await updateFollowButton(userId);
}


async function updateFollowButton(userId){

  const btn =
    $("follow-"+userId);

  if(!btn) return;

  const {data} =
    await supabaseClient
      .from("follows")
      .select("*")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  if(data){

    btn.textContent="Following";
    btn.classList.add("following");

  }else{

    btn.textContent="Follow";
    btn.classList.remove("following");
  }
}


/* ==============================
   DELETE POST
============================== */

async function deletePost(postId){

  if(!confirm("Delete this post?"))
    return;

  const {data:post} =
    await supabaseClient
      .from("posts")
      .select("media_url,media_type")
      .eq("id",postId)
      .eq("user_id",currentUser.id)
      .single();

  const {error} =
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",currentUser.id);

  if(error){

    alert("❌ "+error.message);
    return;
  }

  alert("✅ Post deleted");

  await loadFeed();
  await loadProfile();
}


/* ==============================
   CREATE POST
============================== */

function openCreatePost(){

  $("createModal")
    .classList.remove("hidden");
}

function closeCreatePost(){

  $("createModal")
    .classList.add("hidden");
}


async function createPost(){

  const caption =
    $("postCaption").value.trim();

  const file =
    $("postFile").files[0];

  if(!caption && !file){

    $("postMessage").textContent =
      "⚠️ Write something or select media.";

    return;
  }

  $("postMessage").textContent =
    "⏳ Publishing...";

  let media_url=null;
  let media_type=null;

  try{

    if(file){

      const isVideo =
        file.type.startsWith("video/");

      media_type =
        isVideo ? "video" : "image";

      const bucket =
        isVideo ? "videos" : "posts";

      const ext =
        file.name.split(".").pop();

      const path =
        currentUser.id +
        "/" +
        Date.now() +
        "." +
        ext;

      const upload =
        await supabaseClient.storage
          .from(bucket)
          .upload(path,file,{
            upsert:false
          });

      if(upload.error)
        throw upload.error;

      const publicUrl =
        supabaseClient.storage
          .from(bucket)
          .getPublicUrl(path);

      media_url =
        publicUrl.data.publicUrl;
    }

    const {error} =
      await supabaseClient
        .from("posts")
        .insert({
          user_id:currentUser.id,
          media_url,
          media_type,
          caption
        });

    if(error)
      throw error;

    $("postCaption").value="";
    $("postFile").value="";

    $("postMessage").textContent =
      "✅ Posted successfully!";

    setTimeout(()=>{
      closeCreatePost();
      loadFeed();
      loadProfile();
    },500);

  }catch(error){

    console.error(error);

    $("postMessage").textContent =
      "❌ "+error.message;
  }
}


/* ==============================
   CHANGE AVATAR
============================== */

async function changeAvatar(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const ext =
    file.name.split(".").pop();

  const path =
    currentUser.id +
    "/avatar." +
    ext;

  const upload =
    await supabaseClient.storage
      .from("avatars")
      .upload(path,file,{
        upsert:true
      });

  if(upload.error){

    alert("❌ "+upload.error.message);
    return;
  }

  const publicUrl =
    supabaseClient.storage
      .from("avatars")
      .getPublicUrl(path);

  const url =
    publicUrl.data.publicUrl +
    "?t="+Date.now();

  const {error} =
    await supabaseClient
      .from("profiles")
      .update({
        avatar_url:url
      })
      .eq("id",currentUser.id);

  if(error){

    alert("❌ "+error.message);
    return;
  }

  alert("✅ Profile photo updated!");

  await loadProfile();
  await loadFeed();
}

/* ==============================
   MY POSTS
============================== */

async function loadMyPosts(){

  const {data} =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

  const box =
    $("myPosts");

  if(!data || !data.length){

    box.innerHTML="";
    return;
  }

  box.innerHTML =
    data.map(p=>{

      if(!p.media_url) return "";

      if(p.media_type==="video"){

        return `
        <video
          src="${escapeHtml(p.media_url)}"
          controls>
        </video>`;
      }

      return `
      <img src="${escapeHtml(p.media_url)}">`;

    }).join("");
}


/* ==============================
   USER SEARCH
============================== */

async function searchUsers(){

  const q =
    $("searchInput").value.trim();

  const box =
    $("searchResults");

  if(q.length<2){

    box.classList.add("hidden");
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,full_name,avatar_url"
      )
      .or(
        `username.ilike.%${q}%,full_name.ilike.%${q}%`
      )
      .limit(15);

  if(error){

    console.error(error);
    return;
  }

  box.innerHTML =
    (data||[])
      .map(p=>`

      <div class="result">

        <img
          class="avatar small"
          src="${avatar(p.avatar_url)}">

        <div
          class="resultInfo"
          onclick="openUserProfile('${p.id}')"
          style="cursor:pointer">

          <b>${escapeHtml(
            p.full_name || "User"
          )}</b>

          <div class="username">
            @${escapeHtml(p.username)}
          </div>

        </div>

      </div>

      `).join("");

  box.classList.remove("hidden");
}


/* ==============================
   OTHER USER PROFILE
============================== */

async function openUserProfile(userId){

  $("searchResults")
    .classList.add("hidden");

  const {data:user,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",userId)
      .single();

  if(error){
    alert("❌ "+error.message);
    return;
  }

  const {count:posts} =
    await supabaseClient
      .from("posts")
      .select("*",{count:"exact",head:true})
      .eq("user_id",userId);

  const {count:followers} =
    await supabaseClient
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq("following_id",userId);

  const {count:following} =
    await supabaseClient
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq("follower_id",userId);

  const {data:followData} =
    await supabaseClient
      .from("follows")
      .select("*")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  $("userProfileContent").innerHTML=`

    <div class="profileHead">

      <img
        class="avatar"
        src="${avatar(user.avatar_url)}">

      <div class="profileInfo">

        <h2>
          ${escapeHtml(
            user.full_name || "VYNZO User"
          )}
        </h2>

        <div class="username">
          @${escapeHtml(user.username)}
        </div>

        <div class="bio">
          ${escapeHtml(user.bio || "")}
        </div>

      </div>

    </div>

    <div class="stats">

      <div>
        <b>${posts||0}</b>
        Posts
      </div>

      <div>
        <b>${followers||0}</b>
        Followers
      </div>

      <div>
        <b>${following||0}</b>
        Following
      </div>

    </div>

    ${
      userId!==currentUser.id
      ? `
      <button
        class="followBtn ${
          followData ? "following" : ""
        }"
        style="width:100%"
        onclick="toggleFollow('${userId}')">
        ${followData ? "Following" : "Follow"}
      </button>
      `
      : ""
    }

    <div
      id="otherPosts"
      class="grid">
    </div>
  `;

  $("userModal")
    .classList.remove("hidden");

  const {data:userPosts} =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq("user_id",userId)
      .order("created_at",{ascending:false});

  $("otherPosts").innerHTML =
    (userPosts||[])
      .map(p=>{

        if(!p.media_url) return "";

        if(p.media_type==="video"){

          return `
          <video
            src="${escapeHtml(p.media_url)}"
            controls>
          </video>`;
        }

        return `
        <img src="${escapeHtml(p.media_url)}">`;

      }).join("");

function closeUserProfile(){

    .classList.add("hidden");
}

============================== */

function showPage(page){

  $("homePage")
    .classList.toggle(
      "hidden",
      page!=="home"
    );

  $("profilePage")
    .classList.toggle(
      "hidden",
      page!=="profile"
    );

  if(page==="profile"){
    loadProfile();
  }

  if(page==="home"){
    loadFeed();
  }
}
