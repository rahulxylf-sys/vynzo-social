<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VYNZO Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#070812;
color:#fff;
font-family:Arial,sans-serif;
}
.hidden{display:none!important}

.wrap{
max-width:760px;
margin:auto;
padding:18px 12px 90px;
}

.logo{
text-align:center;
font-size:30px;
font-weight:900;
letter-spacing:4px;
background:linear-gradient(90deg,#ff3d9a,#8b5cf6,#35b7ff);
-webkit-background-clip:text;
color:transparent;
}

.sub{
text-align:center;
color:#9da3bd;
font-size:12px;
margin-bottom:20px;
}

.card{
background:#111426;
border:1px solid #292d47;
border-radius:20px;
padding:16px;
margin-bottom:14px;
}

input,textarea{
width:100%;
background:#0b0e1c;
border:1px solid #292d47;
color:white;
border-radius:12px;
padding:13px;
margin:6px 0 10px;
outline:none;
}

textarea{
min-height:80px;
resize:none;
}

button{
cursor:pointer;
}

.primary{
width:100%;
border:0;
border-radius:13px;
padding:13px;
color:#fff;
font-weight:bold;
background:linear-gradient(90deg,#ff3d9a,#8b5cf6,#3b82f6);
margin:5px 0;
}

.secondary{
width:100%;
border:1px solid #292d47;
border-radius:13px;
padding:12px;
color:#fff;
background:#15182a;
margin:5px 0;
}

.msg{
text-align:center;
color:#aeb4cf;
font-size:13px;
min-height:20px;
margin:8px 0;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.iconbtn{
background:#15182a;
border:1px solid #292d47;
color:white;
border-radius:12px;
padding:9px 12px;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:14px;
}

.tab{
flex:1;
background:#101326;
color:#9da3bd;
border:1px solid #292d47;
padding:10px;
border-radius:12px;
}

.tab.active{
color:#fff;
background:#21183b;
border-color:#754ee8;
}

.file{
display:none;
}

.filebtn{
display:inline-block;
border:1px dashed #4a5070;
padding:11px 14px;
border-radius:12px;
color:#d4d8eb;
}

.preview{
max-width:100%;
max-height:350px;
border-radius:15px;
display:block;
margin:10px auto;
}

.post-head{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:46px;
height:46px;
border-radius:50%;
object-fit:cover;
background:linear-gradient(135deg,#ff3d9a,#8b5cf6,#3b82f6);
display:grid;
place-items:center;
font-weight:bold;
flex:none;
}

.avatar.big{
width:95px;
height:95px;
margin:auto;
font-size:28px;
}

.user strong{
display:block;
}

.user span{
font-size:12px;
color:#9da3bd;
}

.caption{
white-space:pre-wrap;
line-height:1.5;
margin:12px 0;
}

.post-media{
width:100%;
max-height:520px;
object-fit:cover;
border-radius:15px;
}

.actions{
display:flex;
gap:7px;
margin-top:10px;
}

.actions button{
flex:1;
background:#0e1120;
color:#ddd;
border:1px solid #292d47;
border-radius:11px;
padding:9px;
}

.commentbox{
display:flex;
gap:7px;
margin-top:10px;
}

.commentbox input{
margin:0;
}

.commentbox button{
border:0;
border-radius:11px;
background:#292d47;
color:white;
padding:0 13px;
}

.comment{
font-size:13px;
margin-top:8px;
color:#ddd;
}

.comment small{
color:#888;
}

.profile{
text-align:center;
}

.profile h2{
margin:10px 0 3px;
}

.handle{
color:#aaa;
}

.bio{
color:#ccc;
margin:10px 0 18px;
}

.stats{
display:flex;
justify-content:center;
gap:35px;
margin:15px 0;
}

.stat b{
display:block;
font-size:20px;
}

.stat span{
font-size:11px;
color:#999;
}

.photo-actions{
display:flex;
gap:8px;
justify-content:center;
margin-top:12px;
}

.photo-actions label,
.photo-actions button{
border:1px solid #292d47;
background:#15182a;
color:white;
border-radius:12px;
padding:10px 13px;
}

#profileFile{
display:none;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
}

.grid img,
.grid video{
width:100%;
aspect-ratio:1;
object-fit:cover;
border-radius:8px;
background:#111;
}

.empty{
text-align:center;
color:#999;
padding:25px;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#090b16ee;
backdrop-filter:blur(12px);
border-top:1px solid #292d47;
z-index:20;
}

.navin{
max-width:760px;
margin:auto;
display:flex;
padding:8px;
}

.nav button{
flex:1;
border:0;
background:transparent;
color:#888;
padding:8px;
border-radius:12px;
}

.nav button.active{
color:white;
background:#181b30;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authScreen" class="wrap">

<div class="logo">VYNZO</div>

<div class="sub">
CONNECT • CHAT • PLAY • SHARE
</div>

<div class="card">

<h2 style="text-align:center">
Welcome 👋
</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="primary"
onclick="login()">
Login
</button>

<button
class="secondary"
onclick="signup()">
Create Account

class="secondary"
onclick="googleLogin()">
🌐 Continue with Google
</button>

<!-- APP -->
<div id="appScreen" class="wrap hidden">

<div class="topbar">

<div>
<div
class="logo"
style="text-align:left;font-size:24px;margin:0">
VYNZO
</div>

<div
class="sub"
style="text-align:left;margin:0">
Social
</div>
</div>

<button
class="iconbtn"
onclick="logout()">
Logout
</button>

</div>


<div class="tabs">

<button
id="homeTab"
class="tab active"
onclick="showPage('home')">
🏠 Home
</button>

<button
id="profileTab"
class="tab"
onclick="showPage('profile')">
👤 Profile

<!-- HOME -->
<section id="homePage">

<div class="card">

<textarea
id="caption"
placeholder="What's on your mind?">

class="file"

</label>

<img

class="preview hidden">

<video
id="postPreviewVideo"
class="preview hidden"
controls>
</video>

class="primary"
onclick="createPost()">
🚀 Post
</button>

<div id="postMsg" class="msg"></div>

</div>

<!-- PROFILE -->
<section id="profilePage" class="hidden">

<div class="card profile">

<img
id="profileAvatar"
class="avatar big"
alt="Profile">

<div class="photo-actions">

<label for="profileFile">
📷 Change Photo
</label>

<button onclick="removeAvatar()">
Remove
</button>

</div>

<input
id="profileFile"
type="file"
accept="image/*"
onchange="uploadAvatar()">


<h2 id="profileName">
VYNZO User
</h2>

<div
id="profileUsername"
class="handle">
@user
</div>

<div
id="profileBio"
class="bio">
Welcome to VYNZO Social 🚀
</div>

</div>

<b id="followerCount">0</b>

</div>

<b id="followingCount">0</b>

</div>

✏️ Edit Profile
</button>

</div>

<h3>My Posts</h3>

id="myPosts"
class="grid">
</div>

</div>


<!-- BOTTOM NAV -->
<div
id="nav"
class="nav hidden">

<button
id="navHome"

</button>

onclick="showPage('profile')">
👤<br>Profile
</button>

</div>

</div>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://gvfbdfzrhgknqypwwvcy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1JMvSM6APbvinNr5yaDzLg_rwBKEZoh";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
GLOBAL
========================= */

let currentUser = null;
let currentProfile = null;
let allPosts = [];


/* =========================
HELPERS
========================= */

function msg(id,text){

const el=document.getElementById(id);

if(el){
el.textContent=text||"";
}

}


function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];

});

}


/* =========================
LOGIN
========================= */

async function login(){

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

if(!email || !password){

msg(
"authMsg",
"Enter email and password."
);

return;
}

msg(
"authMsg",
"⏳ Logging in..."
);

const {error} =
await supabaseClient.auth
.signInWithPassword({
email,
password
});

if(error){

msg(
"authMsg",
"❌ "+error.message
);

}

}


/* =========================
SIGN UP
========================= */

async function signup(){

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

if(!email || !password){

msg(
"authMsg",
"Enter email and password."
);

return;
}

if(password.length < 6){

msg(
"authMsg",
"Password must be at least 6 characters."
);

return;
}

msg(
"authMsg",
"⏳ Creating account..."
);

const username =
email
.split("@")[0]
.toLowerCase()
.replace(/[^a-z0-9_]/g,"");

const {error} =
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
username:
username || "user",

full_name:
email.split("@")[0]
}
}

});

if(error){

msg(
"authMsg",
"❌ "+error.message
);

}else{

msg(
"authMsg",
"✅ Account created!"
);

}

}


/* =========================
GOOGLE LOGIN
========================= */

async function googleLogin(){

msg(
"authMsg",
"⏳ Opening Google..."
);

const {error} =
await supabaseClient.auth
.signInWithOAuth({

provider:"google",

options:{
redirectTo:
"https://rahulxylf-sys.github.io/vynzo-social/"
}

});

if(error){

msg(
"authMsg",
"❌ "+error.message
);

}

}


/* =========================
AUTH STATE
========================= */

supabaseClient.auth
.onAuthStateChange(
async(event,session)=>{

if(session){

await enterApp(
session.user
);

}else{

currentUser=null;

document
.getElementById("authScreen")
.classList.remove("hidden");

document
.getElementById("appScreen")
.classList.add("hidden");

document
.getElementById("nav")
.classList.add("hidden");

}

});


/* =========================
ENTER APP
========================= */

async function enterApp(user){

currentUser=user;

document
.getElementById("authScreen")
.classList.add("hidden");

document
.getElementById("appScreen")
.classList.remove("hidden");

document
.getElementById("nav")
.classList.remove("hidden");

await ensureProfile();

await refreshProfile();

await loadFeed();

await loadMyPosts();

}


/* =========================
PROFILE
========================= */

async function ensureProfile(){

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(data){

currentProfile=data;

return;

}

const meta =
currentUser.user_metadata || {};

let username =
meta.username ||
meta.full_name ||
currentUser.email
?.split("@")[0] ||
"user";

username =
username
.toLowerCase()
.replace(/[^a-z0-9_]/g,"")
.slice(0,25);

if(!username){
username="user";
}

const {data:created,error} =
await supabaseClient
.from("profiles")
.insert({

id:currentUser.id,

username:

username +

"_" +

Math.floor(
Math.random()*9999
),

full_name:
meta.full_name ||
username

})
.select()
.single();

if(!error){

currentProfile=created;

}

}


async function refreshProfile(){

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(data){

currentProfile=data;

}

const p =
currentProfile || {};

document
.getElementById("profileName")
.textContent =
p.full_name ||
currentUser.email
?.split("@")[0] ||
"VYNZO User";

document
.getElementById("profileUsername")
.textContent =
"@"+
(p.username || "user");

document
.getElementById("profileBio")
.textContent =
p.bio ||
"Welcome to VYNZO Social 🚀";

setAvatar(
"profileAvatar",
p.avatar_url,
p.full_name ||
p.username ||
"U"
);

await loadCounts();

}


/* =========================
AVATAR
========================= */

function setAvatar(
id,
url,
name
){

const el =
document.getElementById(id);

if(url){

el.src=url;

el.style.display="block";

}else{

el.removeAttribute("src");

el.style.display="grid";

el.style.background =
"linear-gradient(135deg,#ff3d9a,#8b5cf6,#3b82f6)";

el.alt =
(name || "U")
.charAt(0)
.toUpperCase();

}

}


/* =========================
COUNTS
========================= */

async function loadCounts(){

const {count:posts} =
await supabaseClient
.from("posts")
.select("id",{
count:"exact",
head:true
})
.eq(
"user_id",
currentUser.id
);

const {count:followers} =
await supabaseClient
.from("follows")
.select("follower_id",{
count:"exact",
head:true
})
.eq(
"following_id",
currentUser.id
);

const {count:following} =
await supabaseClient
.from("follows")
.select("following_id",{
count:"exact",
head:true
})
.eq(
"follower_id",
currentUser.id
);

document
.getElementById("postCount")
.textContent =
posts || 0;

document
.getElementById("followerCount")
.textContent =
followers || 0;

document
.getElementById("followingCount")
.textContent =
following || 0;

}


/* =========================
STORAGE UPLOAD
========================= */

async function uploadToBucket(
file,
bucket
){

const extension =
(file.name.split(".").pop() ||
"jpg").toLowerCase();

const path =
currentUser.id+
"/"+
Date.now()+
"_"+

Math.random()
.toString(36)
.substring(2)+
"."+
extension;

const {error} =
await supabaseClient
.storage
.from(bucket)
.upload(
path,
file,
{
upsert:true,
contentType:file.type
}
);

if(error){

throw error;

}

const {data} =
supabaseClient
.storage
.from(bucket)
.getPublicUrl(path);

return data.publicUrl;

}


/* =========================
PROFILE PHOTO
========================= */

async function uploadAvatar(){

const file =
document
.getElementById("profileFile")
.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){

msg(
"profileMsg",
"❌ Please select an image."
);

return;

}

if(file.size > 8*1024*1024){

msg(
"profileMsg",
"❌ Image must be under 8MB."
);

return;

}

msg(
"profileMsg",
"⏳ Uploading photo..."
);

try{

const url =
await uploadToBucket(
file,
"avatars"
);

const {error} =
await supabaseClient
.from("profiles")
.update({
avatar_url:url
})
.eq(
"id",
currentUser.id
);

if(error){

throw error;

}

currentProfile.avatar_url=url;

setAvatar(
"profileAvatar",
url,
currentProfile.full_name
);

msg(
"profileMsg",
"✅ Profile photo updated!"
);

await loadFeed();

}catch(error){

console.error(error);

msg(
"profileMsg",
"❌ "+error.message
);

}

document
.getElementById("profileFile")
.value="";

}


/* =========================
REMOVE AVATAR
========================= */

async function removeAvatar(){

const {error} =
await supabaseClient
.from("profiles")
.update({
avatar_url:null
})
.eq(
"id",
currentUser.id
);

if(error){

msg(
"profileMsg",
"❌ "+error.message
);

return;

}

currentProfile.avatar_url=null;

setAvatar(
"profileAvatar",
null,
currentProfile.full_name
);

msg(
"profileMsg",
"✅ Profile photo removed."
);

await loadFeed();

}


/* =========================
POST PREVIEW
========================= */

function previewPost(){

const file =
document
.getElementById("postFile")
.files[0];

const img =
document.getElementById(
"postPreviewImg"
);

const video =
document.getElementById(
"postPreviewVideo"
);

img.classList.add("hidden");

video.classList.add("hidden");

if(!file)return;

const url =
URL.createObjectURL(file);

if(
file.type.startsWith("video/")
){

video.src=url;

video.classList.remove(
"hidden"
);

}else{

img.src=url;

img.classList.remove(
"hidden"
);

}

}


/* =========================
CREATE POST
========================= */

async function createPost(){

const file =
document
.getElementById("postFile")
.files[0];

const caption =
document
.getElementById("caption")
.value.trim();

if(!file && !caption){

msg(
"postMsg",
"Write something or add a photo."
);

return;

}

msg(
"postMsg",
"⏳ Publishing..."
);

try{

let media_url=null;

let media_type=null;

if(file){

media_type =
file.type.startsWith("video/")
?
"video"
:
"image";

media_url =
await uploadToBucket(
file,
media_type==="video"
?
"videos"
:
"posts"
);

}

const {error} =
await supabaseClient
.from("posts")
.insert({

user_id:
currentUser.id,

media_url:
media_url,

media_type:
media_type,

caption:
caption

});

if(error){

throw error;

}

document
.getElementById("caption")
.value="";

document
.getElementById("postFile")
.value="";

document
.getElementById("postPreviewImg")
.classList.add("hidden");

document
.getElementById("postPreviewVideo")
.classList.add("hidden");

msg(
"postMsg",
"✅ Posted successfully!"
);

await loadFeed();

await loadMyPosts();

await loadCounts();

}catch(error){

console.error(error);

msg(
"postMsg",
"❌ "+error.message
);

}

}


/* =========================
FEED
========================= */

async function loadFeed(){

  const box = document.getElementById("feed");

  box.innerHTML =
    '<div class="card empty">⏳ Loading posts...</div>';

  try {

    // 1. Get posts without embedding profiles
    const { data: posts, error: postError } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if(postError){
      throw postError;
    }

    if(!posts || posts.length === 0){

      box.innerHTML =
        '<div class="card empty">' +
        'No posts yet 🚀' +
        '</div>';

      return;
    }

    // 2. Get all profile IDs used by these posts
    const userIds = [
      ...new Set(
        posts
          .map(p => p.user_id)
          .filter(Boolean)
      )
    ];

    let profiles = [];

    if(userIds.length > 0){

      const { data: profileData, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,full_name,avatar_url"
          )
          .in("id", userIds);

      if(profileError){
        throw profileError;
      }

      profiles = profileData || [];
    }

    // 3. Connect each post with its profile manually
    allPosts = posts.map(post => {

      const profile =
        profiles.find(
          p => p.id === post.user_id
        ) || {};

      return {
        ...post,
        profiles: profile
      };

    });

    // 4. Render feed
    box.innerHTML =
      allPosts
        .map(renderPost)
        .join("");

    // 5. Load comments
    for(const post of allPosts){

      await loadComments(post.id);

    }

  } catch(error){

    console.error(
      "VYNZO Feed Error:",
      error
    );

    box.innerHTML =
      '<div class="card empty">' +
      '❌ Unable to load posts.<br><br>' +
      '<small>' +
      escapeHtml(error.message) +
      '</small>' +
      '</div>';

  }

}

allPosts =
data || [];

if(!allPosts.length){

box.innerHTML =
'<div class="card empty">'+
'No posts yet 🚀'+
'</div>';

return;

}

box.innerHTML =
allPosts
.map(renderPost)
.join("");

}


/* =========================
RENDER POST
========================= */

function renderPost(post){

const profile =
post.profiles || {};

const name =
profile.full_name ||
profile.username ||
"VYNZO User";

let media="";

if(post.media_url){

if(
post.media_type === "video"
){

media =
'<video class="post-media" '+
'src="'+
escapeHtml(post.media_url)+
'" controls playsinline></video>';

}else{

media =
'<img class="post-media" '+
'src="'+
escapeHtml(post.media_url)+
'" alt="Post">';

}

}

const deleteButton =
post.user_id === currentUser.id
?
'<button onclick="deletePost(\''+
post.id+
'\')">🗑 Delete</button>'
:
"";

return `

<div
class="card"
id="post-${post.id}">

<div class="post-head">

${
profile.avatar_url
?
'<img class="avatar" src="'+
escapeHtml(profile.avatar_url)+
'">'
:
'<div class="avatar">'+
escapeHtml(
(name.charAt(0)||"U")
.toUpperCase()
)+
'</div>'
}

<div class="user">

<strong>
${escapeHtml(name)}
</strong>

<span>
@${escapeHtml(
profile.username ||
"user"
)}
</span>

</div>

</div>

${
post.caption
?
'<div class="caption">'+
escapeHtml(post.caption)+
'</div>'
:
""
}

${media}

<div class="actions">

<button
onclick="toggleLike('${post.id}')">
❤️ Like
</button>

<button
onclick="focusComment('${post.id}')">
💬 Comment
</button>

${deleteButton}

</div>

<div
id="comments-${post.id}">
</div>

<div class="commentbox">

<input
id="comment-${post.id}"
placeholder="Write a comment...">

<button
onclick="addComment('${post.id}')">
Send
</button>

</div>

</div>

`;

}


/* =========================
LIKE
========================= */

async function toggleLike(
postId
){

const {data} =
await supabaseClient
.from("likes")
.select("post_id")
.eq(
"post_id",
postId
)
.eq(
"user_id",
currentUser.id
)
.maybeSingle();

if(data){

await supabaseClient
.from("likes")
.delete()
.eq(
"post_id",
postId
)
.eq(
"user_id",
currentUser.id
);

}else{

await supabaseClient
.from("likes")
.insert({

post_id:
postId,

user_id:
currentUser.id

});

}

}


/* =========================
COMMENTS
========================= */

async function addComment(
postId
){

const input =
document.getElementById(
"comment-"+postId
);

const content =
input.value.trim();

if(!content)return;

const {error} =
await supabaseClient
.from("comments")
.insert({

post_id:
postId,

user_id:
currentUser.id,

content:
content

});

if(error){

alert(error.message);

return;

}

input.value="";

await loadComments(postId);

}


async function loadComments(
postId
){

const {data} =
await supabaseClient
.from("comments")
.select(`
*,
profiles(
username,
full_name
)
`)
.eq(
"post_id",
postId
)
.order(
"created_at",
{
ascending:true
}
);

const box =
document.getElementById(
"comments-"+postId
);

if(!box)return;

box.innerHTML =
(data || [])
.map(comment=>`

<div class="comment">

<b>
@${escapeHtml(
comment.profiles?.username ||
"user"
)}
</b>

${escapeHtml(
comment.content
)}

</div>

`)
.join("");

}


function focusComment(id){

const input =
document.getElementById(
"comment-"+id
);

if(input){

input.focus();

}

}


/* =========================
DELETE POST
========================= */

async function deletePost(id){

if(
!confirm(
"Delete this post?"
)
)return;

const {error} =
await supabaseClient
.from("posts")
.delete()
.eq(
"id",
id
)
.eq(
"user_id",
currentUser.id
);

if(error){

alert(error.message);

return;

}

await loadFeed();

await loadMyPosts();

await loadCounts();

}


/* =========================
MY POSTS
========================= */

async function loadMyPosts(){

const box =
document.getElementById(
"myPosts"
);

const {data,error} =
await supabaseClient
.from("posts")
.select(
"media_url,media_type,caption"
)
.eq(
"user_id",
currentUser.id
)
.order(
"created_at",
{
ascending:false
}
);

if(error){

box.innerHTML =
'<div class="empty">Unable to load.</div>';

return;

}

if(!data?.length){

box.innerHTML =
'<div class="empty">'+
'You have no posts yet.'+
'</div>';

return;

}

box.innerHTML =
data
.map(post=>{

if(
post.media_url &&
post.media_type==="video"
){

return `
<video
src="${escapeHtml(post.media_url)}"
controls>
</video>
`;

}

if(post.media_url){

return `
<img
src="${escapeHtml(post.media_url)}"
alt="post">
`;

}

return `
<div
style="
aspect-ratio:1;
background:#171a2e;
border-radius:8px;
padding:10px;
overflow:hidden">

${escapeHtml(
post.caption ||
"Text post"
)}

</div>
`;

})
.join("");

}


/* =========================
EDIT PROFILE
========================= */

async function editProfile(){

const name =
prompt(
"Full name:",
currentProfile?.full_name || ""
);

if(name===null)return;

const username =
prompt(
"Username:",
currentProfile?.username || "user"
);

if(username===null)return;

const bio =
prompt(
"Bio:",
currentProfile?.bio || ""
);

if(bio===null)return;

const clean =
username
.toLowerCase()
.replace(
/[^a-z0-9_]/g,
""
)
.slice(0,30);

const {data,error} =
await supabaseClient
.from("profiles")
.update({

full_name:name,

username:
clean || "user",

bio:bio

})
.eq(
"id",
currentUser.id
)
.select()
.single();

if(error){

msg(
"profileMsg",
"❌ "+error.message
);

return;

}

currentProfile=data;

await refreshProfile();

await loadFeed();

await loadMyPosts();

msg(
"profileMsg",
"✅ Profile updated!"
);

}


/* =========================
NAVIGATION
========================= */

function showPage(page){

const home =
page === "home";

document
.getElementById("homePage")
.classList.toggle(
"hidden",
!home
);

document
.getElementById("profilePage")
.classList.toggle(
"hidden",
home
);

document
.getElementById("homeTab")
.classList.toggle(
"active",
home
);

document
.getElementById("profileTab")
.classList.toggle(
"active",
!home
);

document
.getElementById("navHome")
.classList.toggle(
"active",
home
);

if(!home){

refreshProfile();

loadMyPosts();

}

}


/* =========================
LOGOUT
========================= */

async function logout(){

await supabaseClient
.auth
.signOut();

}

START
========================= */

(async function(){

const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();

if(session){

await enterApp(
session.user
);

}

})();

</script>
