<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYNZO Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#252047 0%,#0b0b12 45%,#050507 100%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:8px;
}

.logo span{
  color:#8b5cf6;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  border-radius:24px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.tabs{
  display:flex;
  background:#111118;
  border-radius:13px;
  padding:4px;
  margin-bottom:22px;
}

.tabs button{
  width:50%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#aaa;
  font-weight:bold;
}

.tabs button.active{
  background:#8b5cf6;
  color:white;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:13px;
  border-radius:12px;
  border:1px solid #333;
  background:#101016;
  color:white;
  outline:none;
}

input:focus{
  border-color:#8b5cf6;
}

.main-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:5px;
}

.google-btn{
  width:100%;
  padding:13px;
  border:1px solid #444;
  border-radius:13px;
  background:white;
  color:#111;
  font-size:15px;
  font-weight:bold;
  margin-top:15px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#777;
  margin:18px 0;
  font-size:13px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:#333;
  flex:1;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#aaa;
}

.profile{
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
  margin:0 auto 15px;
}

.profile h2{
  margin-bottom:6px;
}

.username{
  color:#9ca3af;
  margin-bottom:10px;
}

.bio{
  color:#bbb;
  margin-bottom:22px;
}

.logout{
  width:100%;
  padding:13px;
  border:1px solid #444;
  border-radius:12px;
  background:#17171f;
  color:white;
  font-weight:bold;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#666;
  font-size:12px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">VYNZO <span>Social</span></div>
  <div class="subtitle">Connect • Share • Follow</div>

  <!-- AUTH SCREEN -->
  <div class="card" id="authScreen">

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">

      <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button class="main-btn" onclick="login()">
        🔐 Login
      </button>

      <div class="divider">OR</div>

      <button class="google-btn" onclick="googleLogin()">
        🔵 Continue with Google
      </button>

    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">

      <input
        type="text"
        id="fullName"
        placeholder="Full name"
      >

      <input
        type="text"
        id="username"
        placeholder="Username"
      >

      <input
        type="email"
        id="signupEmail"
        placeholder="Email address"
      >

      <input
        type="password"
        id="signupPassword"
        placeholder="Password"
      >

      <button class="main-btn" onclick="signup()">
        ✨ Create Account
      </button>

      <div class="divider">OR</div>

      <button class="google-btn" onclick="googleLogin()">
        🔵 Continue with Google
      </button>

    </div>

    <div class="message" id="message"></div>

  </div>


  <!-- PROFILE SCREEN -->
  <div class="card profile hidden" id="profileScreen">

    <div class="avatar" id="avatar">
      V
    </div>

    <h2 id="profileName">VYNZO User</h2>

    <div class="username" id="profileUsername">
      @user
    </div>

    <div class="bio" id="profileBio">
      Welcome to VYNZO Social 🚀
    </div>

    <button class="logout" onclick="logout()">
      🚪 Logout
    </button>

  </div>

  <div class="footer">
    Powered by VYNZO Social
  </div>

</div>


<script>

/* ================================
   SUPABASE CONFIG
================================ */

const SUPABASE_URL =
"https://gvfbdfzrhgknqypwwvcy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1JMvSM6APbvinNr5yaDzLg_rwBKEZoh";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   SCREEN SWITCH
================================ */

function showLogin(){

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("signupBox")
    .classList.add("hidden");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");

  clearMessage();
}


function showSignup(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("signupBox")
    .classList.remove("hidden");

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("signupTab")
    .classList.add("active");

  clearMessage();
}


/* ================================
   MESSAGE
================================ */

function showMessage(text){

  document.getElementById("message").innerText = text;

}

function clearMessage(){

  document.getElementById("message").innerText = "";

}


/* ================================
   EMAIL LOGIN
================================ */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    showMessage("❌ Email and password required");
    return;
  }

  showMessage("⏳ Logging in...");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    showMessage("❌ " + error.message);
    return;
  }

  showMessage("✅ Login successful!");

  await loadUser(data.user);
}


/* ================================
   EMAIL SIGNUP
================================ */

async function signup(){

  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if(!fullName || !username || !email || !password){

    showMessage("❌ Please fill all fields");
    return;
  }

  if(password.length < 6){

    showMessage("❌ Password must be at least 6 characters");
    return;
  }

  showMessage("⏳ Creating account...");

  const { data, error } =
    await supabaseClient.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          full_name:fullName,
          username:username
        }
      }

    });

  if(error){

    showMessage("❌ " + error.message);
    return;
  }

  if(data.user){

    showMessage("✅ Account created!");

    if(data.session){

      await loadUser(data.user);

    }

  }

}


/* ================================
   GOOGLE LOGIN
================================ */

async function googleLogin(){

  showMessage("⏳ Opening Google Login...");

  const { error } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google"

    });

  if(error){

    showMessage("❌ " + error.message);

  }

}


/* ================================
   LOAD USER
================================ */

async function loadUser(user){

  if(!user) return;

  const { data:profile } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("profileScreen")
    .classList.remove("hidden");


  let name =
    profile?.full_name ||
    user.user_metadata?.full_name ||
    user.email?.split("@")[0] ||
    "VYNZO User";


  let username =
    profile?.username ||
    user.user_metadata?.username ||
    "user";


  document.getElementById("profileName")
    .innerText = name;

  document.getElementById("profileUsername")
    .innerText = "@" + username;

  document.getElementById("profileBio")
    .innerText =
      profile?.bio ||
      "Welcome to VYNZO Social 🚀";


  document.getElementById("avatar")
    .innerText =
      name.charAt(0).toUpperCase();

}


/* ================================
   LOGOUT
================================ */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("profileScreen")
    .classList.add("hidden");

  document.getElementById("authScreen")
    .classList.remove("hidden");

  showLogin();

}


/* ================================
   SESSION CHECK
================================ */

async function checkSession(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if(session){

    await loadUser(session.user);

  }

}


/* ================================
   AUTH STATE
================================ */

supabaseClient.auth.onAuthStateChange(
  async (event, session)=>{

    if(session && event === "SIGNED_IN"){

      await loadUser(session.user);

    }

  }
);


/* ================================
   START
================================ */

checkSession();

</script>

</body>
</html>
